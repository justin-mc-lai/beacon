[project]
name = "beacon"
version = "1.0.0"
description = "Beacon - AI Product Workflow Toolkit"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "shellingham>=1.5.0",
    "pytest>=7.0.0",
]

[project.scripts]
beacon = "beacon.main:app"
ptk = "beacon.main:app"
beacon-analyze = "beacon.prefixed:main"
beacon-api-design = "beacon.prefixed:main"
beacon-auto-test = "beacon.prefixed:main"
beacon-brainstorm = "beacon.prefixed:main"
beacon-data-dictionary = "beacon.prefixed:main"
beacon-debug = "beacon.prefixed:main"
beacon-design = "beacon.prefixed:main"
beacon-doctor = "beacon.prefixed:main"
beacon-evolution-summary = "beacon.prefixed:main"
beacon-feedback = "beacon.prefixed:main"
beacon-gate = "beacon.prefixed:main"
beacon-init = "beacon.prefixed:main"
beacon-jtbd = "beacon.prefixed:main"
beacon-kano = "beacon.prefixed:main"
beacon-moscow = "beacon.prefixed:main"
beacon-prd = "beacon.prefixed:main"
beacon-ralph-bridge = "beacon.prefixed:main"
beacon-recall = "beacon.prefixed:main"
beacon-release = "beacon.prefixed:main"
beacon-remember = "beacon.prefixed:main"
beacon-report = "beacon.prefixed:main"
beacon-resume = "beacon.prefixed:main"
beacon-roadmap = "beacon.prefixed:main"
beacon-run = "beacon.prefixed:main"
beacon-save = "beacon.prefixed:main"
beacon-status = "beacon.prefixed:main"
beacon-team = "beacon.prefixed:main"
beacon-test-case = "beacon.prefixed:main"
beacon-test-progress = "beacon.prefixed:main"
beacon-think = "beacon.prefixed:main"
beacon-ui-spec = "beacon.prefixed:main"
beacon-user-story = "beacon.prefixed:main"
beacon-version = "beacon.prefixed:main"
beacon-wireframe = "beacon.prefixed:main"
beacon-work = "beacon.prefixed:main"
beacon-workflow = "beacon.prefixed:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beacon*"]

[tool.beacon]
name = "beacon"
description = "AI Product Workflow Toolkit - Think, Design, Build, Test"
