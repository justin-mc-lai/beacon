[project]
name = "beacon"
version = "1.1.3"
description = "Beacon - Evidence-first Product Workflow Kernel"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "shellingham>=1.5.0",
    "pytest>=7.0.0",
]

[project.scripts]
beacon = "beacon.main:app"
ptk = "beacon.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beacon*"]

[tool.beacon]
name = "beacon"
description = "Evidence-first Product Workflow Kernel - Think, Specify, Verify, Gate"
