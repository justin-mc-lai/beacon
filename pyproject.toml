[project]
name = "beacon"
version = "1.6.11"
description = "Beacon - Evidence-first Product Workflow Kernel"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "shellingham>=1.5.0",
]
keywords = ["cli", "product-workflow", "requirements", "prd", "qa", "release"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
beacon = "beacon.main:app"
ptk = "beacon.main:app"
# PATH governance (v2.0.0): production loom CLI is Rust (beacon-v2 / loom binary).
# Python brand facade is opt-in only — must NOT shadow Rust `loom` on PATH.
loom-py = "loom.main:app"

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beacon*", "loom*"]

[tool.setuptools.package-data]
beacon = ["templates/skill_profiles/*.yaml", "team_roles/*.json"]

[tool.pytest.ini_options]
markers = [
    "smoke: Beacon smoke-path tests",
    "current_contract: Beacon current default behavior contract tests",
    "projection_integrity: Beacon machine projection and transaction integrity tests",
    "compat_contract: Beacon explicit compatibility behavior tests",
    "historical_fixture: Beacon historical artifact readability tests",
    "migration: Beacon auditable migration behavior tests",
    "deprecated: Beacon deprecated command/API callability tests",
]

[tool.beacon]
name = "beacon"
description = "Evidence-first Product Workflow Kernel - Think, Specify, Verify, Gate"
