[project]
name = "beacon"
version = "1.0.0"
description = "Beacon - AI Product Workflow Toolkit"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "shellingham>=1.5.0",
]

[project.scripts]
beacon = "beacon.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.beacon]
name = "beacon"
description = "AI Product Workflow Toolkit - Think, Design, Build, Test"
