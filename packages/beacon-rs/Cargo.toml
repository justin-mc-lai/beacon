[workspace]
resolver = "2"
members = [
    "beacon-core",
    "beacon-store",
    "beacon-orchestrator",
    "beacon-gate",
    "beacon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/beacon/beacon"

[workspace.dependencies]
beacon-core = { path = "beacon-core" }
beacon-store = { path = "beacon-store" }
beacon-orchestrator = { path = "beacon-orchestrator" }
beacon-gate = { path = "beacon-gate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
