[package]
name = "beacon-cli"
description = "Beacon v2 CLI entry (P1+)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
beacon-core = { workspace = true }
beacon-store = { workspace = true }
beacon-gate = { workspace = true }
beacon-orchestrator = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "loom-v2"
path = "src/main.rs"

[[bin]]
name = "beacon-v2"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
serde_json = "1"
